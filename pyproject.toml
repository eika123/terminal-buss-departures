[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avgangstider-entur-python"
version = "0.1.0"
description = "Nordic transit departure board with live weather forecast"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
avgangstider = "avgangstider:main"

[tool.setuptools]
packages = ["adapters"]
py-modules = [
    "avgangstider",
    "cli",
    "config",
    "i18n",
    "models",
    "presenters",
    "resilience",
    "transit_identities",
    "weather",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.17.0",
    "pydeps>=3.0.9",
    "pyflakes>=4.0.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-recording>=0.14.0",
    "radon>=6.0.1",
    "semgrep>=1.182.1",
    "sourcery>=1.46.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
