[project]
name = "avgangstider-entur-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
avgangstider = "avgangstider:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pydeps>=3.0.9",
    "pyflakes>=4.0.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
