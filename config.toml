# ==============================================================================
# Configuration file for Nordic Transit Departure Board (avgangstider)
# Non-secret application display, timing, and query settings.
# ==============================================================================

[display]
# Maximum character width reserved for destination names in departure tables.
# Destination names exceeding this width are truncated so that departure time
# columns remain consistently aligned vertically.
destination_max_width = 27

# Maximum character width reserved for transport mode names (e.g. Buss, Trikk, T-bane).
# Mode names exceeding this width are automatically truncated with a trailing dot (e.g. Spårvagn -> Spårv.).
transport_mode_max_width = 7

# Rapid transit and rapid transport naming style:
# - "cultural" (default): Culturally aware naming based on visitor language (e.g. Finnish user in Oslo sees "Metro", Norwegian in London sees "Tuben").
# - "original": Always use the authentic local name/branding of the system (e.g. "T-bane" in Oslo, "Bybanen" in Bergen, "Tube" in London, "Ratikka" in Tampere).
# - "generic": Standard dictionary translation strictly from selected UI language.
transit_naming_style = "cultural"

# Optional global overrides per transport mode (e.g. if you want "T" or "M" everywhere):
# [display.mode_overrides]
# metro = "T"
# tram = "Trikk"

# Optional per-system overrides (system_id.mode = "name"):
# [display.system_overrides]
# "oslo_ruter.metro" = "T"
# "helsinki_hsl.metro" = "M"
# "stockholm_sl.metro" = "Tuben"

# Total character width for stop headers and divider lines.
terminal_width = 95

# Terminal presentation style:
# - "modern": Colors and transport/weather emojis (default)
# - "classic": Plain ASCII text without colors or emojis
# - "fancy": Extended styling
terminal_style = "modern"

# Whether to display official normalized stop names from the transit API (true)
# or the custom alias configured by the user in stoppesteder.txt (false).
# Setting this to true is recommended initially to verify that your stop IDs match
# the intended stations. Setting this to false allows custom disambiguation
# (e.g., distinguishing east-bound vs west-bound platforms having identical names).
use_normalized_stop_names = true

# Default interface language ("no", "sv", "fi", "en").
# Can be overridden via the command-line flag --lang <lang>.
language = "no"

[query]
# Lookahead time window for upcoming departures in seconds.
# 5400 seconds = 90 minutes (1.5 hours) ahead.
# Can be overridden via the command-line flag --timerange <seconds>.
time_range_seconds = 5400

# Maximum number of departures displayed per stop place.
# Can be overridden via the command-line flag --antall <count>.
departures_count = 10

# Display refresh interval in seconds.
# Can be overridden via the command-line flag --intervall <seconds>.
refresh_interval_seconds = 60

[cache]
# Duration in seconds to cache weather observations from MET Norway on disk.
# 1800 seconds = 30 minutes (recommended by MET to prevent excessive server load).
weather_cache_duration_seconds = 1800

[network]
# Timeout for outgoing HTTP and GraphQL requests in seconds.
request_timeout_seconds = 10

# Maximum consecutive failures before the application terminates cleanly.
max_consecutive_failures = 10
